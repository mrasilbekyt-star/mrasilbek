# Builds a test APK of Steady Doc and attaches it to the "steady-doc-test"
# release, so it can be downloaded straight onto a phone.
name: Steady Doc APK

on:
  push:
    paths:
      - 'steady_doc/**'
      - '.github/workflows/steady_doc_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steady-doc-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steady_doc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Without key.properties the release build is signed with the debug key:
      # fine for testing on a phone, not for the Play Store.
      - run: flutter build apk --release

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk steady-doc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: steady-doc-apk
          path: steady_doc/steady-doc.apk

      - name: Publish to the steady-doc-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete steady-doc-test --yes --cleanup-tag || true
          gh release create steady-doc-test steady-doc.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Steady Doc — test APK" \
            --notes "Branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Telefonga yuklab o'rnating (noma'lum manbalardan o'rnatishga ruxsat bering)."
